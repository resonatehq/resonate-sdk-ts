# Linearizability: the S3 network under the specification's canonical
# workloads, judged by the specification's checker.
#
# The workloads are `resonate-specification/work/ts` (W1 ctx.run, W2 ctx.rpc,
# W3 mixed by parity), copied to `workloads/` and adapted to run the SDK over
# `S3Network` — no server anywhere. The harness records the wire conversation
# at the `Network.send` seam in the trace format of
# `resonate-specification/valid`, and the spec repo's porcupine checkers
# judge it:
#
#   lincheck   does some schedule of internal steps explain THIS order
#   conccheck  does some schedule explain SOME order consistent with the
#              real call/return intervals (the claim about the server)
#
# Every checked workload must pass BOTH — including W3's full n=3 m=2 tree
# (78 single-origin events), which the checker handles since the cone-of-
# influence reduction was ported to valid/porc; W3 additionally asserts the
# closed-form conformance counts (value=m^n, promises=size, tasks=remote)
# from the origin's own document.
#
# Chaos runs (S3_CHAOS=1) repeat W1 and W2 against a lying store — lost
# acknowledgments, vanished writes, delayed answers — with one seed fixed
# and one derived from the run id. A 500 the network answers there is a
# PENDING op the checkers leave free and count; single-process workloads
# have no rival inside the recovery window, so the count is expected to be
# 0 and the chaos gates are really exercising the recovery machinery
# (proof-or-500, never a guess) plus completion under faults.

name: linearizability

on:
  push:
    branches: [main]
    paths:
      - "src/network/s3/**"
      - "src/network/types.ts"
      - "src/async/**"
      - "workloads/**"
      - ".github/workflows/linearizability.yml"
  pull_request:
    paths:
      - "src/network/s3/**"
      - "src/network/types.ts"
      - "src/async/**"
      - "workloads/**"
      - ".github/workflows/linearizability.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "extra chaos seeds, space-separated"
        required: false
        default: ""

concurrency:
  group: linearizability-${{ github.ref }}
  cancel-in-progress: true

env:
  # The spec revision that supplies the checker. Pin to main once the
  # pending-op semantics (valid/porc PendingOp) lands there.
  SPEC_REPO: resonatehq/resonate-specification
  SPEC_REF: claude/resonate-sdk-s3-storage-u9b7kb

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPEC_REPO }}
          ref: ${{ env.SPEC_REF }}
          path: spec
          # For a private spec repo, set a PAT with contents:read as the
          # SPEC_CHECKOUT_TOKEN secret; the default token works when public.
          token: ${{ secrets.SPEC_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: spec/valid/porc/go.sum

      - name: Install SDK dependencies
        run: npm ci

      - name: Build the checkers
        working-directory: spec/valid/porc
        run: |
          go build -o "$RUNNER_TEMP/lincheck"  ./cmd/lincheck
          go build -o "$RUNNER_TEMP/conccheck" ./cmd/conccheck

      - name: Run the canonical workloads and check the traces
        env:
          EXTRA_SEEDS: ${{ inputs.seeds }}
        run: |
          set -uo pipefail
          mkdir -p traces
          LINCHECK="$RUNNER_TEMP/lincheck"
          CONCCHECK="$RUNNER_TEMP/conccheck"
          FAILED=0

          workload() { # name script args... (env via WL_ENV) — the workload
                       # itself gates results and, for W3, the closed-form
                       # promise/task counts
            local name=$1 script=$2; shift 2
            echo "==== $name: workloads/$script $* ===="
            if ! env $WL_ENV S3_TRACE="traces/$name" npx tsx "workloads/$script" "$@"; then
              echo "workload $name FAILED"; FAILED=1
            fi
          }
          pending_of() {
            grep -c '"status":500' "traces/$1.ndjson" || true
          }
          gate() { # name — both checkers must accept
            local name=$1 out code
            for tool in lincheck conccheck; do
              if [ "$tool" = lincheck ]; then
                out=$("$LINCHECK" -quiet -timeout 120s < "traces/$name.ndjson"); code=$?
              else
                out=$("$CONCCHECK" -timeout 120s < "traces/$name.history"); code=$?
              fi
              echo "== $tool $name (exit $code) =="; echo "$out"
              if [ $code -ne 0 ]; then FAILED=1; fi
              echo "| $name | $tool | $([ $code -eq 0 ] && echo LINEARIZABLE || echo '**FAILED**') | $(pending_of "$name") |" >> "$GITHUB_STEP_SUMMARY"
            done
          }

          {
            echo "## Linearizability: canonical workloads over S3Network"
            echo ""
            echo "| trace | checker | verdict | pending (500s) |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          WL_ENV=""
          workload w1     index1.ts w1 4
          workload w2     index2.ts w2 3
          workload w2rpc  index2.ts w2rpc 3 --via rpc
          workload w3     index3.ts w3 3 2
          gate w1
          gate w2
          gate w2rpc
          gate w3

          for seed in 42 $((GITHUB_RUN_ID % 100000)) $EXTRA_SEEDS; do
            WL_ENV="S3_CHAOS=1 S3_SEED=$seed"
            workload "w1c$seed" index1.ts "w1c$seed" 4
            workload "w2c$seed" index2.ts "w2c$seed" 3
            gate "w1c$seed"
            gate "w2c$seed"
          done

          {
            echo ""
            echo "Chaos reproduces with \`S3_CHAOS=1 S3_SEED=<seed> npx tsx workloads/index2.ts <id> 3\`."
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linearizability-traces
          path: traces/
          retention-days: 14
