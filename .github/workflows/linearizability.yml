# Linearizability: the S3 network, judged by the specification's checker.
#
# Traces are produced by scripts/s3-lintrace.ts — real S3Network traffic,
# recorded in the trace format of resonate-specification/valid — and judged
# by the spec repo's porcupine checkers (valid/porc):
#
#   lincheck   does some schedule of internal steps explain THIS order
#   conccheck  does some schedule explain SOME order consistent with the
#              real call/return intervals (the claim about the server)
#
# The gates per regime:
#
#   sequential, sequential+chaos      lincheck must accept (exit 0)
#   concurrent (disjoint origins)     lincheck AND conccheck must accept
#   contention, contention+chaos      conccheck must accept; the recorded
#                                     order is only one guess between racing
#                                     processes, so lincheck is informational
#
# Chaos regimes run against a lying store (lost acknowledgments, vanished
# writes). A 500 the network answers there is a PENDING op — the checker
# leaves it free and reports `pending: N`, which the job summary surfaces:
# LINEARIZABLE is only as strong as that count is low.
#
# Seeds are fixed for reproducibility plus one derived from the run id, so
# every CI run also explores a fresh interleaving; a failure names its seed.

name: linearizability

on:
  push:
    branches: [main]
    paths:
      - "src/network/s3/**"
      - "src/network/types.ts"
      - "scripts/s3-lintrace.ts"
      - ".github/workflows/linearizability.yml"
  pull_request:
    paths:
      - "src/network/s3/**"
      - "src/network/types.ts"
      - "scripts/s3-lintrace.ts"
      - ".github/workflows/linearizability.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "extra chaos seeds, space-separated"
        required: false
        default: ""

concurrency:
  group: linearizability-${{ github.ref }}
  cancel-in-progress: true

env:
  # The spec revision whose checker judges us. Pin to main once the
  # pending-op semantics (valid/porc PendingOp) lands there.
  SPEC_REPO: resonatehq/resonate-specification
  SPEC_REF: claude/resonate-sdk-s3-storage-u9b7kb

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SPEC_REPO }}
          ref: ${{ env.SPEC_REF }}
          path: spec
          # For a private spec repo, set a PAT with contents:read as the
          # SPEC_CHECKOUT_TOKEN secret; the default token works when public.
          token: ${{ secrets.SPEC_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: spec/valid/porc/go.sum

      - name: Install SDK dependencies
        run: npm ci

      - name: Build the checkers
        working-directory: spec/valid/porc
        run: |
          go build -o "$RUNNER_TEMP/lincheck"  ./cmd/lincheck
          go build -o "$RUNNER_TEMP/conccheck" ./cmd/conccheck

      - name: Produce traces and check them
        env:
          EXTRA_SEEDS: ${{ inputs.seeds }}
        run: |
          set -uo pipefail
          mkdir -p traces
          LINCHECK="$RUNNER_TEMP/lincheck"
          CONCCHECK="$RUNNER_TEMP/conccheck"
          SEEDS="42 7 1999 $((GITHUB_RUN_ID % 100000)) $EXTRA_SEEDS"
          FAILED=0

          produce() { # name mode [env...]
            local name=$1 mode=$2; shift 2
            env "$@" npx tsx scripts/s3-lintrace.ts "traces/$name" "$mode" | tail -1
          }
          pending_of() { # count 500-answered ops in a trace
            grep -c '"status":500' "traces/$1.ndjson" || true
          }
          gate() { # tool name  -> records verdict, sets FAILED on gate breach
            local tool=$1 name=$2 out code
            if [ "$tool" = lincheck ]; then
              out=$("$LINCHECK" -quiet < "traces/$name.ndjson"); code=$?
            else
              out=$("$CONCCHECK" < "traces/$name.history"); code=$?
            fi
            echo "== $tool $name (exit $code) =="; echo "$out"
            if [ $code -ne 0 ]; then FAILED=1; fi
            echo "| $name | $tool | $([ $code -eq 0 ] && echo LINEARIZABLE || echo '**FAILED**') | $(pending_of "$name") |" >> "$GITHUB_STEP_SUMMARY"
          }

          echo "## Linearizability: S3 network vs the specification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| trace | checker | verdict | pending (500s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          produce seq  sequential
          produce sc   sequential TRACE_CHAOS=1
          produce conc concurrent

          gate lincheck seq
          gate lincheck sc
          gate lincheck conc
          gate conccheck conc

          produce cont contend
          gate conccheck cont

          for seed in $SEEDS; do
            produce "cc$seed" contend TRACE_CHAOS=1 TRACE_SEED="$seed"
            gate conccheck "cc$seed"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Chaos seeds: \`$SEEDS\` — a failure reproduces with \`TRACE_SEED=<seed> TRACE_CHAOS=1 npx tsx scripts/s3-lintrace.ts out contend\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Contention regimes are judged by conccheck (interval search); the recorded order is one guess between racing processes." >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linearizability-traces
          path: traces/
          retention-days: 14
